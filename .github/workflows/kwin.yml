name: kwin-cloud
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  virtual-session:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install distribution runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-venv libegl1 libopengl0 libxkbcommon0 libglib2.0-bin dbus-daemon kwin-wayland layer-shell-qt qml6-module-org-kde-layershell libkscreen-bin qt6-wayland konsole libcap2-bin passwd util-linux
      - name: Remove unneeded file capability in disposable container
        run: |
          # Debian's CAP_SYS_NICE file capability is outside Docker's bounding set.
          # Software compositor tests require no extra capability or privileged runner.
          if [ -n "$(getcap /usr/bin/kwin_wayland)" ]; then
            setcap -r /usr/bin/kwin_wayland
          fi
      - uses: actions/checkout@v4
      - name: Run disposable sessions as a normal user
        run: |
          useradd --create-home matrix-ci
          chown -R matrix-ci:matrix-ci "$GITHUB_WORKSPACE"
          runuser -u matrix-ci -- ./tools/setup.sh
          runuser -u matrix-ci -- .venv/bin/python tools/cloud_check.py --prefix /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kwin-cloud-${{ github.sha }}
          path: artifacts/kwin
          retention-days: 14
