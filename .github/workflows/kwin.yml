name: kwin-cloud
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  virtual-session:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install distribution runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-venv libegl1 libopengl0 libxkbcommon0 libglib2.0-bin dbus-daemon kwin-wayland layer-shell-qt qml6-module-org-kde-layershell libkscreen-bin qt6-wayland konsole
      - uses: actions/checkout@v4
      - name: Run disposable sessions as a normal user
        run: |
          useradd --create-home matrix-ci
          chown -R matrix-ci:matrix-ci "$GITHUB_WORKSPACE"
          runuser -u matrix-ci -- ./tools/setup.sh
          runuser -u matrix-ci -- .venv/bin/python tools/cloud_check.py --prefix /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kwin-cloud-${{ github.sha }}
          path: artifacts/kwin
          retention-days: 14
