name: development-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1
      - run: ./tools/setup.sh
      - run: ./tools/check.sh
      - run: .venv/bin/python -m pip wheel --no-deps --no-build-isolation . -w dist
