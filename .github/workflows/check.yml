name: development-gates
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1 libglib2.0-bin dbus-daemon libpulse0
      - run: ./tools/setup.sh
      - run: ./tools/check.sh
      - run: .venv/bin/python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Upload test reports and wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-check-${{ github.sha }}
          path: |
            artifacts/tests.xml
            dist/*.whl
          retention-days: 14
          if-no-files-found: ignore
