[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-shell"
version = "0.1.0"
description = "Qt Quick desktop shell for a KWin Wayland session"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3"]

[project.scripts]
matrix-shell = "matrix_shell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrix_shell = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
